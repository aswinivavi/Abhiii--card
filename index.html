<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Abhinand</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ffeaf1;font-family:Georgia,serif;color:#743c54;text-align:center}.card{background:#fffafd;padding:35px 20px;border-radius:25px;max-width:340px;box-shadow:0 8px 30px #c88a9c55}h1{font-weight:normal}.env{font-size:90px;cursor:pointer;margin:30px}.msg{display:none;line-height:1.8}.show .msg{display:block}button{background:#c45d83;color:white;border:0;border-radius:25px;padding:14px 25px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="card" id="card">
<p>HAPPY BOYFRIEND'S DAY</p>
<h1>For Abhinand ♡</h1>
<div class="env" onclick="openCard()">💌</div>
<p>Tap the envelope to open your surprise</p>
<div class="msg"><h2>Happy Boyfriend's Day! ❤️</h2><p>Thank you for making my days brighter and my moments more special. I am so happy to have you in my life. Here's to many more beautiful memories together. Love you! 💗</p></div>
<button onclick="openCard()">OPEN MY NOTE ♡</button>
</div>
<script>function openCard(){document.getElementById("card").classList.add("show")}</script>
</body>
</html>
